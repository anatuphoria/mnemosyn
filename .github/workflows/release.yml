name: Release

on:
  push:
    tags: ["v*"]
    branches: [packaging]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[desktop,atlas-build,package]"
      - name: Sources that can only be downloaded by hand
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sources --pattern "*.zip" --dir manual
      - name: Build the shareable atlas
        run: python -m tools.build_atlas --manual-dir manual
      - name: Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libfuse2
      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - name: Package
        run: python -m tools.package
      - name: Smoke test on Linux
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run -a ./dist/Mnemosyn-*-x86_64.AppImage --first-frame
      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Mnemosyn-*-Setup.exe
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Mnemosyn\Mnemosyn.exe"
          Invoke-WebRequest https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z -OutFile mesa.7z
          7z x mesa.7z -omesa -y > $null
          Copy-Item mesa\x64\*.dll (Split-Path $app)
          $env:QT_QPA_PLATFORM = "offscreen"
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process $app -ArgumentList "--first-frame" -Wait -PassThru
          $seconds = $clock.Elapsed.TotalSeconds
          Write-Output "Mnemosyn ran for $seconds s and exited with $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Mnemosyn exited with $($process.ExitCode)" }
          if ($seconds -lt 1) { throw "Mnemosyn closed too early to have drawn a frame" }
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*-Setup.exe
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: sha256sum Mnemosyn-* > SHA256SUMS.txt
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --prerelease
          --title "Mnemosyn $GITHUB_REF_NAME (test version)"
          --notes "Test version for Windows and Linux with the shareable atlas. See https://mnemo.saeed.cool/download/ for how to open it the first time."
