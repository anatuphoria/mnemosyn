site_name: Mnemosyn
site_description: A free 3D atlas of the human central nervous system for students
site_url: https://mnemo.saeed.cool/
repo_url: https://github.com/anatuphoria/mnemosyn
repo_name: anatuphoria/mnemosyn
docs_dir: build/site-docs
site_dir: build/site
theme:
  name: material
  font:
    text: Inter
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light}
    - scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark}
  logo: assets/mark.svg
  favicon: assets/favicon.png
  features: [navigation.tabs, navigation.sections, navigation.top, navigation.instant, search.highlight, content.code.copy, toc.follow]
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/saeeedhany
      name: GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.com/users/1098257642356482099
      name: Discord
    - icon: material/forum-outline
      link: https://github.com/anatuphoria/mnemosyn/discussions
      name: Discussions
extra_css: [stylesheets/extra.css, "https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap"]
extra_javascript: [javascripts/favicon.js, javascripts/teaser.js]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Get started:
      - Download: download.md
  - Handbook:
      - Start here: handbook/index.md
      - Why Mnemosyn: handbook/why.md
      - Workspaces:
          - Explore: handbook/explore.md
          - Slices: handbook/slices.md
          - Pathways: handbook/pathways.md
          - Lab: handbook/lab.md
          - The stress axis: handbook/lab-stress.md
          - Water balance: handbook/lab-water.md
          - Lesion: handbook/lesion.md
          - Quizzes: handbook/quizzes.md
      - Experiments:
          - All experiments: handbook/experiments/index.md
          - Central or nephrogenic?: handbook/experiments/central-or-nephrogenic.md
          - A night without water: handbook/experiments/a-night-without-water.md
          - Too much water: handbook/experiments/too-much-water.md
          - The dexamethasone tests: handbook/experiments/dexamethasone-tests.md
          - Addison's disease: handbook/experiments/addisons-disease.md
          - Stopping a steroid course: handbook/experiments/stopping-a-steroid-course.md
          - One artery, many structures: handbook/experiments/one-artery-many-structures.md
          - Which side?: handbook/experiments/which-side.md
      - Sources and review: handbook/trust.md
  - The atlas:
      - Structures: atlas/structures.md
      - Data sources: atlas/sources.md
  - Review:
      - Take part: review.md
      - Reviewers: reviewers.md
  - How it was made:
      - Building the atlas: building-the-atlas.md
      - Decisions: decisions.md
      - Performance: performance.md
      - Design documents: design/index.md
