"name" = "Blood pressure reflex"
"scope" = "This model follows mean arterial pressure, heart rate, sympathetic and vagal nerve activity, the resistance of the vessels and blood volume second by second. Stretch sensors in the carotid sinus and the aortic arch report pressure to the nucleus of the solitary tract in the medulla, which slows the heart through the vagus and holds back the sympathetic neurons of the ventrolateral medulla [hall2021] [guyenet2006]. Pressure is the product of the heart's output and the resistance of the vessels, and the heart's output follows its filling [hall2021]. The model covers the first seconds to minutes only. It leaves out the kidneys, renin, angiotensin, aldosterone and vasopressin, which set pressure over hours to days, the slow resetting of the sensors to a new pressure, breathing, the low pressure sensors of the heart and lungs, and the difference between systolic and diastolic pressure. Its strengths and speeds are set to give textbook sized responses and are not fitted to one person."
"normal.steady" = "At rest lying down, mean arterial pressure is about 90 to 100 mmHg and the heart beats about 70 times a minute, held there because any rise in pressure slows the heart and relaxes the vessels within seconds, and any fall does the opposite [hall2021]."
"value.map.name" = "Mean arterial pressure"
"value.hr.name" = "Heart rate"
"value.symp.name" = "Sympathetic activity"
"value.symp.note" = "Sympathetic nerve firing to the heart and vessels cannot be given one unit across people, so it is shown as a multiple of its level at rest [guyenet2006]."
"value.vagal.name" = "Vagal activity"
"value.vagal.note" = "The vagal slowing of the heart is shown as a multiple of its level at rest [hall2021]."
"value.tpr.name" = "Vessel resistance"
"value.blood.name" = "Blood volume"
"group.sensors.name" = "Pressure sensors"
"group.heart.name" = "Heart"
"group.nerves.name" = "Nerves"
"group.vessels.name" = "Vessels and blood"
"parameter.set_point.name" = "Sensor midpoint"
"parameter.set_point.meaning" = "The pressure at which the sensors fire at half their greatest rate; they respond most steeply around the normal mean pressure [hall2021]."
"parameter.steepness.name" = "Sensor steepness"
"parameter.steepness.meaning" = "An assumption of this project: how sharply sensor firing rises with pressure, set so the sensors are nearly silent at 50 to 60 mmHg and close to their greatest rate near 180 mmHg, the range Guyton and Hall describe [hall2021]."
"parameter.k_map.name" = "Pressure response rate"
"parameter.k_map.meaning" = "An assumption of this project: arterial pressure follows the heart's output and the vessel resistance within about ten seconds."
"parameter.k_hr.name" = "Heart rate response rate"
"parameter.k_hr.meaning" = "An assumption of this project: the pacemaker follows its nerves within about five seconds."
"parameter.k_vagal.name" = "Vagal response rate"
"parameter.k_vagal.meaning" = "How fast vagal activity follows the sensors; the vagus acts on the heart within a beat or two [hall2021]. The value is an assumption of this project."
"parameter.k_symp.name" = "Sympathetic response rate"
"parameter.k_symp.meaning" = "How fast sympathetic activity follows the sensors; sympathetic effects build over about ten to fifteen seconds [hall2021]. The value is an assumption of this project."
"parameter.k_tpr.name" = "Vessel response rate"
"parameter.k_tpr.meaning" = "An assumption of this project: the small arteries tighten or relax over about twenty seconds."
"parameter.hr_intrinsic.name" = "Heart rate without nerves"
"parameter.hr_intrinsic.meaning" = "The rate the pacemaker keeps when both sets of nerves are blocked, about 100 beats a minute in a young adult and lower with age [jose1970]."
"parameter.hr_symp.name" = "Sympathetic effect on rate"
"parameter.hr_symp.meaning" = "An assumption of this project: how many beats a minute resting sympathetic activity adds, set so blocking it slows the heart to about 60."
"parameter.hr_vagal.name" = "Vagal effect on rate"
"parameter.hr_vagal.meaning" = "An assumption of this project: how many beats a minute resting vagal activity takes away, set so the resting rate is 70 and blocking the vagus gives about 110 to 115 [jose1970]."
"parameter.sv_rest.name" = "Stroke volume at rest"
"parameter.sv_rest.meaning" = "The blood the left ventricle ejects with each beat at rest, about 70 mL [hall2021]."
"parameter.starling.name" = "Effect of filling on stroke volume"
"parameter.starling.meaning" = "How strongly the stroke volume follows the filling of the heart, the Frank Starling mechanism [hall2021]. The value is an assumption of this project."
"parameter.inotropy.name" = "Sympathetic effect on the beat"
"parameter.inotropy.meaning" = "How much sympathetic activity strengthens each beat [hall2021]. The value is an assumption of this project."
"parameter.afterload.name" = "Effect of pressure on stroke volume"
"parameter.afterload.meaning" = "How much a higher arterial pressure, which the ventricle must pump against, reduces the stroke volume [hall2021]. The value is an assumption of this project."
"parameter.venous.name" = "Sympathetic effect on the veins"
"parameter.venous.meaning" = "How much sympathetic activity tightens the veins and so fills the heart [hall2021]. The value is an assumption of this project."
"parameter.tpr_rest.name" = "Vessel resistance at rest"
"parameter.tpr_rest.meaning" = "The total resistance of the circulation at rest: a mean pressure of 93 mmHg divided by an output of about 4.9 L/min [hall2021]."
"parameter.tpr_gain.name" = "Sympathetic effect on resistance"
"parameter.tpr_gain.meaning" = "How much sympathetic activity tightens the small arteries [hall2021]. The value is an assumption of this project."
"parameter.blood_normal.name" = "Normal blood volume"
"parameter.blood_normal.meaning" = "The blood volume of an adult, about 5 L [hall2021]."
"parameter.refill.name" = "Refill rate"
"parameter.refill.meaning" = "An assumption of this project: after a loss, fluid moves from the tissues into the blood over hours [hall2021]."
"parameter.afferent.name" = "Sensor nerves"
"parameter.afferent.meaning" = "How much of the signal from the sensors reaches the medulla, from 0 (nerves cut) to 1."
"parameter.afferent.stop.normal" = "Normal"
"parameter.afferent.stop.partial" = "Partial"
"parameter.afferent.stop.none" = "None"
"parameter.reflex.name" = "Reflex strength"
"parameter.reflex.meaning" = "How much the autonomic nerves can change their activity from its resting level, from 0 (fixed) to 1."
"parameter.reflex.stop.normal" = "Normal"
"parameter.reflex.stop.partial" = "Partial"
"parameter.reflex.stop.none" = "None"
"parameter.symp_range.name" = "Sympathetic range"
"parameter.symp_range.meaning" = "An assumption of this project: how far sympathetic activity can rise above or fall below its resting level when the sensors fall silent or fire fully [guyenet2006]."
"parameter.vagal_range.name" = "Vagal range"
"parameter.vagal_range.meaning" = "An assumption of this project: how far vagal activity can rise above or fall below its resting level."
"parameter.reset.name" = "Shift of the sensors' target"
"parameter.reset.meaning" = "An assumption of this project: how far alarm or exercise raises the pressure the reflex defends, so pressure and heart rate can rise together [guyenet2006]."
"parameter.pooling.name" = "Blood returning from the legs"
"parameter.pooling.meaning" = "The share of the usual filling that reaches the heart; standing pools blood in the legs and lowers it [hall2021]."
"parameter.beta.name" = "Beta receptors"
"parameter.beta.meaning" = "How much of the sympathetic effect on the heart gets through, from 0 (blocked) to 1."
"parameter.muscarinic.name" = "Muscarinic receptors"
"parameter.muscarinic.meaning" = "How much of the vagal effect on the heart gets through, from 0 (blocked) to 1."
"parameter.alpha.name" = "Alpha receptors"
"parameter.alpha.meaning" = "How much of the sympathetic effect on the vessels gets through, from 0 (blocked) to 1."
"parameter.dilate.name" = "Direct relaxing of the vessels"
"parameter.dilate.meaning" = "Vessel resistance as a share of normal under a drug that relaxes the vessels directly."
"parameter.constrict.name" = "Direct tightening of the vessels"
"parameter.constrict.meaning" = "Resistance added by a drug that tightens the vessels directly."
"parameter.sinus_press.name" = "Pressure on the carotid sinus"
"parameter.sinus_press.meaning" = "Extra stretch of the carotid sinus from outside, which the sensors read as a higher pressure."
"parameter.command.name" = "Central command"
"parameter.command.meaning" = "A drive from higher centres, as in alarm or exercise, that raises sympathetic activity and lowers vagal activity whatever the sensors report."
"curve.baroreceptors.name" = "Sensor firing"
"curve.baroreceptors.x" = "Arterial pressure (mmHg)"
"curve.baroreceptors.y" = "Firing (share of the greatest rate)"
"part.baroreceptors" = "Carotid sinus and aortic arch"
"part.nerves" = "Sinus and aortic nerves"
"part.nts" = "Nucleus of the solitary tract"
"part.vasomotor" = "Ventrolateral medulla"
"part.vagus" = "Vagus nerve"
"part.heart" = "Heart"
"part.vessels" = "Arteries and veins"
"effect.sensed" = "The sensors read the stretch of the artery wall, which follows the pressure inside it and any pressure from outside [hall2021]."
"effect.firing" = "Stretch sensors in the carotid sinus and aortic arch fire faster as pressure rises and send this to the nucleus of the solitary tract through the glossopharyngeal and vagus nerves [hall2021] [guyenet2006]."
"effect.symp_drive" = "The nucleus of the solitary tract excites inhibitory neurons of the caudal ventrolateral medulla, which hold back the sympathetic neurons of the rostral ventrolateral medulla, so more sensor firing means less sympathetic activity [guyenet2006]."
"effect.vagal_drive" = "The nucleus of the solitary tract excites the vagal neurons that slow the heart, so more sensor firing means more vagal activity [hall2021] [guyenet2006]."
"effect.hr_target" = "The pacemaker's own rate is raised by sympathetic nerves through beta receptors and lowered by the vagus through muscarinic receptors [hall2021] [jose1970]."
"effect.fill" = "The heart fills according to how much blood there is, how much of it pools in the legs, and how tightly sympathetic activity holds the veins [hall2021]."
"effect.stroke" = "A fuller heart ejects more with each beat, sympathetic activity strengthens the beat, and a higher arterial pressure makes it harder to eject [hall2021]."
"effect.output" = "The heart's output is its rate times the volume of each beat [hall2021]."
"effect.tpr_target" = "Sympathetic activity tightens the small arteries through alpha receptors, and drugs can tighten or relax them directly [hall2021]."
"term.build_pressure" = "Arterial pressure builds as the heart's output meets the resistance of the vessels [hall2021]."
"term.run_off" = "Blood runs off from the arteries into the tissues, so pressure settles where output and resistance hold it [hall2021]."
"term.pace" = "The nerves set the rate of the pacemaker [hall2021]."
"term.settle_rate" = "The heart rate settles at the rate its nerves set [hall2021]."
"term.fire_symp" = "The ventrolateral medulla drives the sympathetic nerves to the heart and vessels [guyenet2006]."
"term.fade_symp" = "Sympathetic activity settles at the level the medulla sets [guyenet2006]."
"term.fire_vagal" = "The medulla drives the vagal fibres to the heart [hall2021]."
"term.fade_vagal" = "Vagal activity settles at the level the medulla sets [hall2021]."
"term.tighten" = "The small arteries tighten towards the tone their nerves and any drugs set [hall2021]."
"term.relax" = "The small arteries settle at that tone [hall2021]."
"term.refill_blood" = "Fluid from the tissues slowly restores the blood volume [hall2021]."
"term.shift_out" = "Blood volume settles at its normal level [hall2021]."
"experiment.stand" = "Stand up"
"experiment.stand.description" = "Stand up from lying down: several hundred millilitres of blood pool in the legs, the heart fills less and pressure dips until the reflex answers [hall2021] [freeman2011]."
"experiment.blood_loss" = "Lose blood"
"experiment.blood_loss.option.volume" = "Volume"
"experiment.blood_loss.description" = "Lose a volume of blood at once. The heart fills less; the reflex speeds the heart and tightens the vessels, which hides a moderate loss [hall2021]."
"experiment.fluid" = "Give fluid"
"experiment.fluid.option.volume" = "Volume"
"experiment.fluid.description" = "Add a volume of fluid to the blood at once, which fills the heart more [hall2021]."
"experiment.carotid_massage" = "Press on the carotid sinus"
"experiment.carotid_massage.description" = "Firm pressure on the carotid sinus for some seconds stretches the sensors, which report a rise in pressure that is not there, so the heart slows and pressure falls [hall2021]."
"experiment.fright" = "Sudden alarm"
"experiment.fright.description" = "A fright or mental stress drives the sympathetic nerves from above and shifts the pressure the reflex defends, so pressure and heart rate rise together for a few minutes [guyenet2006]."
"experiment.beta_blocker" = "Beta blocker"
"experiment.beta_blocker.description" = "Block most of the sympathetic effect on the heart, as propranolol does: the heart slows and beats less strongly [hall2021]."
"experiment.atropine" = "Atropine"
"experiment.atropine.description" = "Block the vagal effect on the heart: the rate rises towards the pacemaker's own rate and above it [jose1970]."
"experiment.alpha_blocker" = "Alpha blocker"
"experiment.alpha_blocker.description" = "Block most of the sympathetic effect on the vessels: they relax, pressure falls and the heart speeds up by reflex [hall2021]."
"experiment.vasoconstrictor" = "Vessel tightening drug"
"experiment.vasoconstrictor.description" = "A drug that tightens the vessels directly, as phenylephrine does: pressure rises and the reflex slows the heart [hall2021]."
"experiment.vasodilator" = "Vessel relaxing drug"
"experiment.vasodilator.description" = "A drug that relaxes the vessels directly: pressure falls and the reflex speeds the heart [hall2021]."
"experiment.denervation" = "Sensor nerves cut"
"experiment.denervation.description" = "With the nerves from the carotid sinus and aortic arch cut, the medulla hears nothing from the sensors, as if pressure were very low, so sympathetic activity, heart rate and pressure rise sharply. In animals the average pressure returns towards normal over days but swings widely [cowley1973], which this model of the first minutes does not follow."
"experiment.autonomic_failure" = "Autonomic failure"
"experiment.autonomic_failure.description" = "The autonomic nerves keep their resting activity but can hardly change it, as in neurogenic orthostatic hypotension: on standing, pressure falls and stays down and the heart rate barely rises [freeman2011]."
"check.rest" = "At rest the mean arterial pressure and the heart rate sit in their normal ranges [hall2021]."
"check.standing" = "On standing, less blood returns to the heart; the reflex speeds the heart, raises sympathetic activity, lowers vagal activity and tightens the vessels, which brings pressure back close to its resting level within a minute or two [hall2021] [freeman2011]."
"check.bleeding" = "After a loss of about a litre of blood the heart speeds up and the vessels tighten, so pressure falls only a little [hall2021]."
"check.tightening" = "A drug that tightens the vessels raises pressure, and the reflex answers with more vagal activity and a slower heart [hall2021]."
"check.relaxing" = "A drug that relaxes the vessels lowers pressure, and the reflex speeds the heart [hall2021]."
"check.beta_blocked" = "A beta blocker slows the heart; the fall in output lowers pressure a little, so sympathetic activity rises by reflex [hall2021]."
"check.vagus_blocked" = "Atropine removes the vagal slowing, so the heart speeds up well above its resting rate [jose1970]; the rise in pressure holds sympathetic activity down [hall2021]."
"check.alpha_blocked" = "An alpha blocker relaxes the vessels and lowers pressure, and the reflex speeds the heart [hall2021]."
"check.nerves_cut" = "Without the signal from the sensors, vagal activity falls and sympathetic activity rises, so the heart rate and pressure rise sharply in the first minutes [hall2021] [cowley1973]."
"check.failure_standing" = "When the autonomic nerves cannot change their activity, standing lowers pressure and it stays down, while the heart rate barely changes [freeman2011]."
"check.sinus_pressed" = "Pressure on the carotid sinus slows the heart and lowers pressure while it lasts, and both return to rest within minutes of letting go [hall2021]."
"check.alarm" = "Alarm raises sympathetic activity and pressure together for as long as it lasts, and they return to rest afterwards [guyenet2006]."
"parameter.k_map.up" = "Pressure follows the heart and vessels more quickly."
"parameter.k_map.down" = "Pressure follows the heart and vessels more slowly."
"parameter.k_hr.up" = "The heart rate follows its nerves more quickly."
"parameter.k_hr.down" = "The heart rate follows its nerves more slowly."
"parameter.k_vagal.up" = "The vagus answers a change in pressure more quickly."
"parameter.k_vagal.down" = "The vagus answers a change in pressure more slowly."
"parameter.k_symp.up" = "The sympathetic nerves answer a change in pressure more quickly."
"parameter.k_symp.down" = "The sympathetic nerves answer more slowly, so pressure dips for longer on standing."
"parameter.k_tpr.up" = "The vessels tighten and relax more quickly."
"parameter.k_tpr.down" = "The vessels tighten and relax more slowly."
"parameter.refill.up" = "Lost blood volume is replaced from the tissues more quickly."
"parameter.refill.down" = "Lost blood volume is replaced more slowly."
