"name" = "Stress axis"
"scope" = "This model follows CRH, ACTH and cortisol minute by minute, and the size of the pituitary's corticotroph cells and of the adrenal cortex over days and weeks, after Karin and colleagues [karin2020], with hormone clearance rates from Andersen and colleagues [andersen2013]. Three assumptions of this project are added and marked as such: cortisol feedback through MR stays finite when cortisol is absent, the adrenal cortex's answer to ACTH levels off at high ACTH, and gland growth has a ceiling. It leaves out the ultradian pulses, ACTH and CRH from outside the axis, vasopressin, binding proteins, the kidneys and the liver, and the drugs metyrapone and mifepristone, whose behaviour could not yet be tied to checked sources. It is a study model, not a tool for diagnosis or treatment."
"normal.morning_rise" = "Cortisol climbs in the early morning and peaks around half past eight, at about 15.5 µg/dL in healthy adults [debono2009]."
"normal.daytime_fall" = "Through the day the drive from the body clock weakens and cortisol slowly falls [debono2009]."
"normal.night_low" = "From the evening until early morning cortisol stays below its daily mean, reaching its lowest point, under 2 µg/dL, shortly after midnight [debono2009]."

"value.crh.name" = "CRH"
"value.crh.note" = "CRH in the pituitary's own portal blood has not been measured in people, so it is shown as a multiple of its normal daily mean."
"value.acth.name" = "ACTH"
"value.acth.note" = "ACTH reference ranges depend on the laboratory's assay, so ACTH is shown as a multiple of its normal daily mean."
"value.cortisol.name" = "Cortisol"
"value.corticotrophs.name" = "Corticotroph mass"
"value.corticotrophs.note" = "The total working mass of the pituitary cells that make ACTH, as a multiple of normal [karin2020]."
"value.adrenal.name" = "Adrenal cortex mass"
"value.adrenal.note" = "The total working mass of the adrenal cells that make cortisol, as a multiple of normal [karin2020]."
"value.dex_gut.name" = "Dexamethasone still in the gut"
"value.dex.name" = "Dexamethasone in the body"
"value.hc_gut.name" = "Hydrocortisone still in the gut"

"parameter.w1.name" = "CRH removal rate"
"parameter.w1.meaning" = "How fast CRH is removed; a half life of about four minutes [andersen2013]."
"parameter.w2.name" = "ACTH removal rate"
"parameter.w2.meaning" = "How fast ACTH is removed; a half life of about twenty minutes [andersen2013]."
"parameter.w3.name" = "Cortisol removal rate"
"parameter.w3.meaning" = "How fast cortisol is removed; a half life of about 76 minutes [andersen2013]."
"parameter.wC.name" = "Corticotroph turnover"
"parameter.wC.meaning" = "How fast corticotroph mass grows or shrinks; 0.099 a day [karin2020]."
"parameter.wA.name" = "Adrenal cortex turnover"
"parameter.wA.meaning" = "How fast adrenal cortex mass grows or shrinks; 0.049 a day [karin2020]."
"parameter.K_GR.name" = "GR halfway point"
"parameter.K_GR.meaning" = "The cortisol level at which the low affinity glucocorticoid receptor gives half of its brake [karin2020]."
"parameter.n.name" = "GR steepness"
"parameter.n.meaning" = "How sharply the GR brake comes on [andersen2013]."
"parameter.K_MR.name" = "MR halfway point"
"parameter.K_MR.meaning" = "An assumption of this project: the high affinity MR brake follows a Michaelis Menten curve, as in Andersen and colleagues [andersen2013], instead of growing without limit as cortisol falls."
"parameter.K_sat.name" = "Adrenal saturation point"
"parameter.K_sat.meaning" = "An assumption of this project: the ACTH level, as a multiple of normal, at which the adrenal cortex gives half of its extra answer, so that very high ACTH cannot raise cortisol without limit."
"parameter.C_max.name" = "Corticotroph growth ceiling"
"parameter.C_max.meaning" = "An assumption of this project: corticotroph mass cannot grow past this multiple of normal."
"parameter.A_max.name" = "Adrenal growth ceiling"
"parameter.A_max.meaning" = "An assumption of this project: adrenal cortex mass cannot grow past this multiple of normal."
"parameter.depth.name" = "Daily rhythm depth"
"parameter.depth.meaning" = "How strongly the body clock swings the drive to the axis over the day, set so the cortisol peak and low match healthy adults [debono2009]."
"parameter.phase.name" = "Daily rhythm timing"
"parameter.phase.meaning" = "The clock time, in minutes after midnight, when the body clock's drive is strongest, set so cortisol peaks around half past eight [debono2009]."
"parameter.depth2.name" = "Daily rhythm shape"
"parameter.depth2.meaning" = "A second, twice daily swing that makes the morning rise steeper than the evening fall, set to match healthy adults [debono2009]."
"parameter.phase2.name" = "Daily rhythm shape timing"
"parameter.phase2.meaning" = "When the twice daily swing is strongest, in minutes after midnight, set to match healthy adults [debono2009]."
"parameter.stress.name" = "Stress drive"
"parameter.stress.meaning" = "Extra drive to the paraventricular nucleus from a stressor, as a multiple of the basal drive [karin2020]."
"parameter.stalk.name" = "Pituitary stalk"
"parameter.stalk.meaning" = "The share of CRH that reaches the pituitary through its stalk; 1 when the stalk is whole."
"parameter.dex_ka.name" = "Dexamethasone absorption rate"
"parameter.dex_ka.meaning" = "How fast swallowed dexamethasone reaches the blood, set so it peaks about 1.6 to 2 hours after the dose [loew1986]."
"parameter.dex_ke.name" = "Dexamethasone removal rate"
"parameter.dex_ke.meaning" = "How fast dexamethasone is removed; a half life of about 3.4 hours [harahap2009]."
"parameter.dex_potency.name" = "Dexamethasone strength at GR"
"parameter.dex_potency.meaning" = "How strongly each milligram of dexamethasone presses the GR brake, compared with cortisol; set so the overnight 1 mg test is normal in the healthy model [nieman2008]."
"parameter.hc_ka.name" = "Hydrocortisone absorption rate"
"parameter.hc_ka.meaning" = "How fast swallowed hydrocortisone reaches the blood [mollmann1991]."
"parameter.hc_units.name" = "Cortisol per milligram of hydrocortisone"
"parameter.hc_units.meaning" = "How much each absorbed milligram adds to blood cortisol, set so 20 mg peaks near the levels measured after an oral dose [mollmann1991]."
"parameter.acth_tumour.name" = "ACTH from a pituitary tumour"
"parameter.acth_tumour.meaning" = "ACTH made by a corticotroph tumour, as a multiple of normal ACTH; 0 when there is none."
"parameter.K_tumour.name" = "Tumour GR halfway point"
"parameter.K_tumour.meaning" = "A corticotroph tumour still answers the GR brake but needs much more of it, so a high dose of dexamethasone suppresses it while a low dose does not [tyrrell1986]."
"parameter.cortisol_tumour.name" = "Cortisol from an adrenal tumour"
"parameter.cortisol_tumour.meaning" = "Cortisol made by an adrenal tumour that ignores ACTH, as a multiple of the normal daily mean; 0 when there is none."

"part.pvn" = "Paraventricular nucleus"
"part.pituitary" = "Anterior pituitary"
"part.adrenal_cortex" = "Adrenal cortex"
"part.blood" = "Blood"

"effect.rhythm" = "The body clock drives the paraventricular nucleus hardest in the early morning, and stressors add to that drive [karin2020] [debono2009]."
"effect.gr_signal" = "The glucocorticoid receptor reads cortisol and dexamethasone together, since both bind it [nieman2008]."
"effect.mr_hold" = "Cortisol on the high affinity mineralocorticoid receptor holds back CRH release [andersen2013] [karin2020]."
"effect.gr_hold" = "Cortisol and dexamethasone on the low affinity glucocorticoid receptor hold back both CRH and ACTH release [karin2020]."
"effect.acth_drive" = "ACTH drives the adrenal cortex to make cortisol, an answer that levels off at very high ACTH (an assumption of this project)."

"term.make_crh" = "The paraventricular nucleus releases CRH into the pituitary's portal blood [karin2020]."
"term.clear_crh" = "CRH is removed within minutes [andersen2013]."
"term.make_acth" = "CRH drives the corticotroph cells of the anterior pituitary to release ACTH [karin2020]."
"term.tumour_acth" = "A corticotroph tumour makes ACTH of its own, held back only by a lot of GR signal [tyrrell1986]."
"term.clear_acth" = "ACTH is removed with a half life of about twenty minutes [andersen2013]."
"term.make_cortisol" = "ACTH drives the adrenal cortex to make cortisol, in proportion to how much adrenal cortex there is [karin2020]."
"term.tumour_cortisol" = "An adrenal tumour makes cortisol whatever the ACTH level."
"term.absorb_hydrocortisone" = "Swallowed hydrocortisone is absorbed and is cortisol itself [mollmann1991]."
"term.clear_cortisol" = "Cortisol is removed with a half life of about 76 minutes [andersen2013]."
"term.grow_corticotrophs" = "Above normal, CRH makes the corticotroph mass grow over weeks; below normal it shrinks [karin2020]."
"term.grow_adrenal" = "Above normal, ACTH makes the adrenal cortex grow over weeks; below normal it shrinks [karin2020]."
"term.dex_leaves_gut" = "Dexamethasone leaves the gut as it is absorbed [loew1986]."
"term.absorb_dex" = "Dexamethasone is absorbed into the blood, peaking about 1.6 to 2 hours after a dose [loew1986]."
"term.clear_dex" = "Dexamethasone is removed with a half life of about 3.4 hours [harahap2009]."
"term.hydrocortisone_leaves_gut" = "Hydrocortisone leaves the gut as it is absorbed [mollmann1991]."

"experiment.hypophysectomy" = "Remove the pituitary"
"experiment.hypophysectomy.description" = "Surgical removal of the pituitary gland (hypophysectomy). In this model it removes the corticotroph cells, the only source of ACTH [karin2020]."
"experiment.stalk_cut" = "Cut the pituitary stalk"
"experiment.stalk_cut.description" = "Cutting the stalk stops CRH from the hypothalamus reaching the anterior pituitary through the portal vessels."
"experiment.adrenalectomy" = "Remove both adrenal glands"
"experiment.adrenalectomy.description" = "Surgical removal of both adrenal glands (bilateral adrenalectomy), so no cortisol is made."
"experiment.dexamethasone" = "Dexamethasone"
"experiment.dexamethasone.description" = "A strong synthetic glucocorticoid taken by mouth. It presses the GR brake but is not measured as cortisol, which is why it is used to test the axis [nieman2008]."
"experiment.dexamethasone.option.dose" = "Dose"
"experiment.hydrocortisone" = "Hydrocortisone"
"experiment.hydrocortisone.description" = "Cortisol itself, taken by mouth as a single dose [mollmann1991]."
"experiment.hydrocortisone.option.dose" = "Dose"
"experiment.hydrocortisone_course" = "Daily hydrocortisone course"
"experiment.hydrocortisone_course.description" = "Hydrocortisone every morning for weeks. The steady extra cortisol holds ACTH down, the adrenal cortex shrinks, and after stopping it takes weeks to recover [karin2020]."
"experiment.hydrocortisone_course.option.dose" = "Daily dose"
"experiment.addison" = "Addison's disease"
"experiment.addison.description" = "Primary adrenal insufficiency: most of the adrenal cortex is destroyed, usually by the immune system, so cortisol is low and ACTH high [bornstein2016]. In this model the destruction keeps pace with any regrowth, so the working mass stays at the share that is left."
"experiment.addison.option.destroyed" = "Share destroyed"
"experiment.cushing_disease" = "Cushing's disease"
"experiment.cushing_disease.description" = "A pituitary corticotroph tumour makes too much ACTH, so cortisol is high. The tumour still answers a high dose of dexamethasone [tyrrell1986] [nieman2008]."
"experiment.cushing_disease.option.size" = "Tumour ACTH"
"experiment.adrenal_tumour" = "Cortisol making adrenal tumour"
"experiment.adrenal_tumour.description" = "An adrenal tumour makes cortisol on its own. ACTH is held down and the rest of the adrenal cortex shrinks [nieman2008]."
"experiment.adrenal_tumour.option.output" = "Tumour cortisol"
"experiment.short_stressor" = "Short stressor"
"experiment.short_stressor.description" = "An hour of physical or psychological stress, which drives the paraventricular nucleus harder [karin2020]."
"experiment.short_stressor.option.strength" = "Strength"
"experiment.long_stressor" = "Long lasting stressor"
"experiment.long_stressor.description" = "Weeks of stress. The glands grow while it lasts and take weeks to settle afterwards [karin2020]."
"experiment.long_stressor.option.strength" = "Strength"

"test.low_dose_test" = "Overnight 1 mg dexamethasone test"
"test.low_dose_test.description" = "1 mg of dexamethasone between 23:00 and midnight, then serum cortisol at 08:00 the next morning [nieman2008]."
"test.low_dose_test.normal" = "Cortisol is suppressed below 1.8 µg/dL (50 nmol/L), the normal answer [nieman2008]."
"test.low_dose_test.abnormal" = "Cortisol is not suppressed below 1.8 µg/dL (50 nmol/L), which points to Cushing's syndrome [nieman2008]."
"test.high_dose_test" = "Overnight 8 mg dexamethasone test"
"test.high_dose_test.description" = "8 mg of dexamethasone at 23:00, then plasma cortisol the next morning, compared with the morning before [tyrrell1986]."
"test.high_dose_test.normal" = "Cortisol falls to less than half of its baseline, which in Cushing's syndrome points to a pituitary cause [tyrrell1986]."
"test.high_dose_test.abnormal" = "Cortisol does not fall to less than half of its baseline [tyrrell1986]."
"test.acth_test" = "ACTH stimulation test"
"test.acth_test.description" = "250 µg of cosyntropin into a vein, with cortisol measured after 30 and 60 minutes [bornstein2016]. In this model the dose is given as an ACTH level forty times normal, since the model's adrenal answer levels off well below the real peak ACTH."
"test.acth_test.normal" = "Cortisol reaches at least 18 µg/dL (500 nmol/L), the normal answer [bornstein2016]."
"test.acth_test.abnormal" = "Cortisol stays below 18 µg/dL (500 nmol/L), which points to adrenal insufficiency [bornstein2016]."

"check.daily_rhythm" = "Cortisol peaks around half past eight within the healthy range and is lowest shortly after midnight [debono2009]."
"check.stress_response" = "After a short stressor ACTH peaks before cortisol, and cortisol is back to normal within hours [karin2020]."
"check.low_dose_normal" = "The overnight 1 mg dexamethasone test is normal in the healthy model [nieman2008]."
"check.hypophysectomy" = "Removing the pituitary makes ACTH and cortisol fall and CRH rise [karin2020]."
"check.adrenal_loss" = "In Addison's disease cortisol is low and ACTH and CRH are high [bornstein2016]."
"check.adrenalectomy" = "Removing both adrenal glands makes cortisol fall and ACTH rise [bornstein2016]."
"check.cushing_disease" = "In Cushing's disease ACTH and cortisol are high, the low dose test is not suppressed, and the high dose test is [nieman2008] [tyrrell1986]."
"check.adrenal_tumour" = "An adrenal tumour makes cortisol high and ACTH low, and the rest of the adrenal cortex shrinks [nieman2008]."
"check.atrophy_after_hypophysectomy" = "Hours after the pituitary is removed the ACTH test is still normal; four weeks later the adrenal cortex has shrunk and the test is abnormal [karin2020] [bornstein2016]."
"check.recovery_after_hydrocortisone" = "After four weeks of daily hydrocortisone the adrenal cortex has shrunk, cortisol stays low after stopping, and it recovers over the following weeks [karin2020]."
