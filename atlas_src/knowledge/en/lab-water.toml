"name" = "Water balance"
"scope" = "This model follows body water, plasma osmolality (shown as plasma sodium), vasopressin, urine concentration and thirst minute by minute. Vasopressin rises in step with plasma osmolality above a threshold [robertson1976] [baylis1980] and is cleared with a half life of about 24 minutes [baumann1976]; urine concentrates with vasopressin between about 50 and 1200 mOsm/kg [hall2021] [robertson1973]; thirst rises from nearly the same threshold [thompson1986]. Food salt is taken to balance the solute the kidneys pass, and habitual drinking runs evenly through the day. It leaves out blood volume and blood pressure reflexes, aldosterone and the kidney's medullary washout, sleep, and the stress axis, which this model does not see. It is a study model, not a tool for diagnosis or treatment."
"normal.steady" = "In a healthy adult drinking freely, plasma sodium stays near 140 mmol/L, vasopressin near 1 to 2 pg/mL and the urine moderately concentrated, because small changes in osmolality quickly change vasopressin and thirst [robertson1976] [hall2021]."

"value.sodium.name" = "Plasma sodium"
"value.avp.name" = "Vasopressin"
"value.uosm.name" = "Urine osmolality"
"value.thirst.name" = "Thirst"
"value.water.name" = "Body water"
"value.gut.name" = "Water still in the gut"
"value.ddavp.name" = "Desmopressin in the body"

"parameter.avp_threshold.name" = "Vasopressin threshold"
"parameter.avp_threshold.meaning" = "The plasma osmolality above which vasopressin rises; about 281 to 284 mOsm/kg in healthy adults [robertson1976] [baylis1980]."
"parameter.avp_slope.name" = "Vasopressin sensitivity"
"parameter.avp_slope.meaning" = "How much vasopressin rises for each mOsm/kg above the threshold; about 0.35 to 0.63 pg/mL [robertson1976] [baylis1980]."
"parameter.k_avp.name" = "Vasopressin removal rate"
"parameter.k_avp.meaning" = "How fast vasopressin is removed from plasma; a half life of about 24 minutes [baumann1976]."
"parameter.uosm_min.name" = "Most dilute urine"
"parameter.uosm_min.meaning" = "The urine osmolality without vasopressin, about 50 mOsm/kg [hall2021]."
"parameter.uosm_max.name" = "Most concentrated urine"
"parameter.uosm_max.meaning" = "The highest urine osmolality the kidneys reach, about 1200 mOsm/kg [hall2021]."
"parameter.K_u.name" = "Kidney halfway point"
"parameter.K_u.meaning" = "The vasopressin level at which urine is half way between its most dilute and most concentrated, set so urine is close to its most concentrated at the vasopressin levels measured after fluid deprivation [robertson1973]."
"parameter.n_u.name" = "Kidney steepness"
"parameter.n_u.meaning" = "An assumption of this project: how sharply urine concentration follows vasopressin."
"parameter.k_kidney.name" = "Kidney response rate"
"parameter.k_kidney.meaning" = "An assumption of this project: urine concentration follows vasopressin with a delay of about half an hour."
"parameter.solute.name" = "Solute passed in urine"
"parameter.solute.meaning" = "The solute the kidneys pass each minute, about 860 mOsm a day on an ordinary diet, balanced by solute eaten [hall2021]."
"parameter.solute_ref.name" = "Normal body solute"
"parameter.solute_ref.meaning" = "The solute in body water at normal osmolality, about 286 mOsm/kg in 42 L [hall2021]."
"parameter.insensible.name" = "Insensible water loss"
"parameter.insensible.meaning" = "Water lost through the skin and breath, about 0.7 L a day [hall2021]."
"parameter.habit.name" = "Habitual drinking"
"parameter.habit.meaning" = "Water taken in by habit, with food and from metabolism, about 2.4 L a day [hall2021]."
"parameter.drink_threshold.name" = "Thirst drinking threshold"
"parameter.drink_threshold.meaning" = "The plasma osmolality above which thirst makes a person drink more than usual, between the threshold of thirst [thompson1986] and the osmolality at which thirst is first reported [baylis1980]."
"parameter.drink_gain.name" = "Thirst drinking strength"
"parameter.drink_gain.meaning" = "An assumption of this project: how much more a thirsty person drinks for each mOsm/kg above the drinking threshold."
"parameter.k_thirst.name" = "Thirst response rate"
"parameter.k_thirst.meaning" = "An assumption of this project: thirst follows plasma osmolality within about ten minutes."
"parameter.k_gut.name" = "Water absorption rate"
"parameter.k_gut.meaning" = "An assumption of this project: half of the water drunk is absorbed in about 15 minutes."
"parameter.ddavp_clear.name" = "Desmopressin removal rate"
"parameter.ddavp_clear.meaning" = "How fast desmopressin is removed; a half life of about 3.7 hours [agerso2004]."
"parameter.ddavp_potency.name" = "Desmopressin strength"
"parameter.ddavp_potency.meaning" = "An assumption of this project: each microgram of desmopressin acts on the kidneys like 10 pg/mL of vasopressin."
"parameter.drinking.name" = "Access to water"
"parameter.drinking.meaning" = "Whether the person can drink, from 0 (no water) to 1 (free access)."
"parameter.habit_scale.name" = "Habitual drinking scale"
"parameter.habit_scale.meaning" = "Habitual drinking as a multiple of normal."
"parameter.avp_scale.name" = "Vasopressin release scale"
"parameter.avp_scale.meaning" = "How much of the normal osmotic release of vasopressin is left, from 0 to 1."
"parameter.avp_auto.name" = "Unregulated vasopressin"
"parameter.avp_auto.meaning" = "Vasopressin released whatever the osmolality."
"parameter.kidney.name" = "Kidney response"
"parameter.kidney.meaning" = "How much of the kidney's normal ability to concentrate urine is left, from 0 to 1."
"parameter.salt_in.name" = "Salt infusion rate"
"parameter.salt_in.meaning" = "Solute infused into a vein each minute."
"parameter.iv_water.name" = "Infused water rate"
"parameter.iv_water.meaning" = "Water infused into a vein each minute."

"part.osmoreceptors" = "Osmoreceptors"
"part.son" = "Supraoptic nucleus"
"part.pvn" = "Paraventricular nucleus"
"part.pituitary" = "Posterior pituitary"
"part.kidney" = "Kidney"
"part.blood" = "Blood"

"effect.avp_release" = "Osmoreceptors sense plasma osmolality and drive the supraoptic and paraventricular nuclei to release vasopressin from the posterior pituitary above a threshold [robertson1976] [baylis1980]."
"effect.kidney_signal" = "Vasopressin, and desmopressin like it, acts on the collecting ducts of the kidney [hall2021]."
"effect.concentrating" = "With more vasopressin the kidney returns more water to the blood and the urine becomes more concentrated [hall2021] [robertson1973]."
"effect.solute_out" = "An assumption of this project: the kidneys pass solute in proportion to the solute the body holds, so extra salt is passed over the following days [hall2021]."
"effect.urine_flow" = "The more concentrated the urine, the less of it there is for the same solute, so less water is lost [hall2021]."
"effect.thirst_drive" = "Thirst rises with plasma osmolality from nearly the same threshold as vasopressin [thompson1986]."
"effect.drink" = "People drink by habit through the day, and more when thirst is strong [hall2021] [baylis1980]."

"term.release_avp" = "The posterior pituitary releases vasopressin into the blood [robertson1976]."
"term.clear_avp" = "Vasopressin is removed with a half life of about 24 minutes [baumann1976]."
"term.concentrate_urine" = "The kidney concentrates the urine as vasopressin directs [robertson1973]."
"term.relax_urine" = "Without the signal the urine returns towards its dilute state [hall2021]."
"term.feel_thirst" = "Rising osmolality is felt as thirst [thompson1986]."
"term.fade_thirst" = "Thirst fades as osmolality falls [thompson1986]."
"term.swallow" = "Water drunk enters the gut [hall2021]."
"term.absorb_gut" = "Water leaves the gut as it is absorbed [hall2021]."
"term.absorb_water" = "Absorbed or infused water adds to body water [hall2021]."
"term.lose_urine" = "Urine carries water out of the body [hall2021]."
"term.lose_insensible" = "Skin and breath lose water all the time [hall2021]."
"term.dilute" = "Water gained dilutes the body's solute and lowers plasma osmolality [hall2021]."
"term.concentrate" = "Water lost concentrates the body's solute and raises plasma osmolality [hall2021]."
"term.eat_solute" = "Solute eaten adds to the body's solute [hall2021]."
"term.pass_solute" = "Solute passed in urine leaves the body [hall2021]."
"term.add_salt" = "Infused salt raises plasma osmolality [baylis1980]."
"term.clear_ddavp" = "Desmopressin is removed with a half life of about 3.7 hours [agerso2004]."

"check.normal_day" = "On a normal day plasma sodium, urine osmolality and vasopressin stay in their healthy ranges [hall2021] [robertson1973]."

"experiment.water_load" = "Drink water"
"experiment.water_load.description" = "Drink a volume of water at once; it is absorbed within the hour and dilutes the blood [hall2021]."
"experiment.water_load.option.volume" = "Volume"
"experiment.stop_drinking" = "Stop drinking"
"experiment.stop_drinking.description" = "No water from this time on; the body keeps losing water in urine, skin and breath [hall2021]."
"experiment.hypertonic_saline" = "Salty infusion"
"experiment.hypertonic_saline.description" = "Half a litre of 3 percent saline into a vein over two hours, the stimulus used to test vasopressin release [baylis1980]."
"experiment.desmopressin" = "Desmopressin"
"experiment.desmopressin.description" = "A synthetic vasopressin that acts on the kidneys for hours [agerso2004] [christcrain2019]."
"experiment.desmopressin.option.dose" = "Dose"
"experiment.central_di" = "Central diabetes insipidus"
"experiment.central_di.description" = "The brain releases almost no vasopressin, so the urine stays dilute and plentiful while thirst keeps sodium near normal [christcrain2019]."
"experiment.nephrogenic_di" = "Nephrogenic diabetes insipidus"
"experiment.nephrogenic_di.description" = "The kidneys barely answer vasopressin, so the urine stays dilute although vasopressin is high [christcrain2019]."
"experiment.siadh" = "SIADH"
"experiment.siadh.description" = "Vasopressin is released whatever the osmolality, so water is kept and plasma sodium falls over days [hall2021]."
"experiment.primary_polydipsia" = "Primary polydipsia"
"experiment.primary_polydipsia.description" = "Drinking far more than needed, which suppresses vasopressin and gives large volumes of dilute urine while the kidneys still work [christcrain2019]."

"test.water_deprivation_test" = "Water deprivation test"
"test.water_deprivation_test.description" = "No water for 8 hours, then the urine osmolality is read [christcrain2019]."
"test.water_deprivation_test.normal" = "The urine concentrates, so vasopressin release and the kidneys both work [christcrain2019]."
"test.water_deprivation_test.abnormal" = "The urine stays dilute despite thirst, which points to diabetes insipidus [christcrain2019]."
"test.desmopressin_test" = "Desmopressin test"
"test.desmopressin_test.description" = "After 8 hours without water, desmopressin is given and the urine osmolality is read again two hours later [christcrain2019]."
"test.desmopressin_test.normal" = "Little further rise: the kidneys were already concentrating as far as they can, or they cannot answer, as in nephrogenic diabetes insipidus [christcrain2019]."
"test.desmopressin_test.abnormal" = "A rise of more than half: vasopressin was missing and the kidneys answer it, as in central diabetes insipidus [christcrain2019]."

"check.water_load" = "A litre of water lowers plasma sodium within the hour and is passed within about four hours [hall2021] [robertson1973]."
"check.deprivation_normal" = "Eight hours without water concentrate the urine well above 600 mOsm/kg in a healthy person [christcrain2019]."
"check.central_di_tests" = "In central diabetes insipidus the urine stays dilute without water and rises by more than half after desmopressin [christcrain2019]."
"check.nephrogenic_di_tests" = "In nephrogenic diabetes insipidus the urine stays dilute without water and barely rises after desmopressin [christcrain2019]."
"check.polydipsia_tests" = "In primary polydipsia the urine concentrates without water and desmopressin adds little [christcrain2019]."
"check.siadh_sodium" = "With vasopressin released regardless of osmolality and ordinary drinking, plasma sodium falls below 135 mmol/L within days [hall2021]."
"check.saline_vasopressin" = "A salty infusion raises vasopressin as plasma osmolality climbs [baylis1980]."

