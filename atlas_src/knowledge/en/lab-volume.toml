"name" = "Blood pressure over days"
"scope" = "This model follows mean arterial pressure, the volume of extracellular fluid, the sodium the kidneys excrete, and renin, angiotensin II and aldosterone over hours to weeks. It shows how salt balance at the kidney sets the pressure in the long run [guyton1972]. Sodium and water are taken to move together, so the sodium concentration stays fixed; water balance on its own is the Water balance system. The fast nerve reflex is left out because it acts in seconds and adapts within days; it is the Blood pressure reflex system [hall2021]. Potassium, natriuretic peptides and the sympathetic nerves to the kidney are not modelled. The strengths of the hormone effects are assumptions of this project, chosen so that known responses appear in the right direction and rough size."
"normal.steady" = "On a usual diet of about 150 mmol of sodium a day, the kidneys excrete what is eaten, the extracellular fluid stays near 14 L and the mean arterial pressure near 93 mmHg [hall2021]."
"value.map.name" = "Mean arterial pressure"
"value.ecf.name" = "Extracellular fluid"
"value.excretion.name" = "Sodium excretion"
"value.renin.name" = "Renin"
"value.renin.note" = "Plasma renin activity depends on the assay and on posture and diet, so it is shown as a multiple of its level on a usual diet [hall2021]."
"value.ang.name" = "Angiotensin II"
"value.ang.note" = "Angiotensin II is shown as a multiple of its level on a usual diet [hall1986]."
"value.aldo.name" = "Aldosterone"
"value.aldo.note" = "Aldosterone is shown as a multiple of its level on a usual diet [hall2021]."
"group.kidney.name" = "Kidney"
"group.body.name" = "Fluid and vessels"
"group.hormones.name" = "Hormones"
"parameter.set_point.name" = "Balance pressure"
"parameter.set_point.meaning" = "The pressure at the kidney at which a healthy kidney, with usual hormone levels, excretes a usual day's sodium [guyton1972]."
"parameter.nat.name" = "Pressure effect on excretion"
"parameter.nat.meaning" = "How steeply sodium excretion rises with the pressure at the kidney, called pressure natriuresis [guyton1972]. The value is an assumption of this project."
"parameter.salt_normal.name" = "Usual sodium intake"
"parameter.salt_normal.meaning" = "The sodium eaten on a usual diet, about 150 mmol a day, given here per minute [hall2021]."
"parameter.ecf_normal.name" = "Normal extracellular fluid"
"parameter.ecf_normal.meaning" = "The extracellular fluid of an adult, about 14 L, of which the blood plasma is about 3 L [hall2021]."
"parameter.sodium.name" = "Sodium concentration"
"parameter.sodium.meaning" = "The sodium concentration of extracellular fluid, about 140 mmol/L. Thirst and vasopressin hold it steady, so each 140 mmol of sodium retained keeps about a litre of water with it [hall2021]."
"parameter.vol_gain.name" = "Volume effect on pressure"
"parameter.vol_gain.meaning" = "How much the pressure rises when extracellular fluid, and with it the blood volume, expands. Over days the tissues tighten their own vessels as flow rises, which makes the effect larger than the first filling of the heart alone [guyton1972]. The value is an assumption of this project."
"parameter.ang_press.name" = "Angiotensin effect on vessels"
"parameter.ang_press.meaning" = "How much angiotensin II raises pressure by tightening the small arteries [hall2021]. The value is an assumption of this project."
"parameter.ang_ret.name" = "Angiotensin effect on the kidney"
"parameter.ang_ret.meaning" = "How much angiotensin II makes the kidney hold sodium, mainly in the proximal tubule and by narrowing the vessel that leaves the filter [hall1986]. The value is an assumption of this project."
"parameter.aldo_ret.name" = "Aldosterone effect on the kidney"
"parameter.aldo_ret.meaning" = "How much aldosterone makes the collecting duct hold sodium [hall2021]. The value is an assumption of this project."
"parameter.renin_pressure.name" = "Pressure effect on renin"
"parameter.renin_pressure.meaning" = "How steeply renin release rises as the pressure at the kidney falls, sensed in the wall of the afferent arteriole [hall2021]. The value is an assumption of this project."
"parameter.renin_salt.name" = "Salt effect on renin"
"parameter.renin_salt.meaning" = "How strongly renin release rises when less salt reaches the macula densa, the sensor at the start of the distal tubule [hall2021]. The value is an assumption of this project."
"parameter.short.name" = "Angiotensin feedback on renin"
"parameter.short.meaning" = "How much angiotensin II itself holds back renin release [hall2021]. The value is an assumption of this project."
"parameter.renin_max.name" = "Greatest renin release"
"parameter.renin_max.meaning" = "An assumption of this project: the most renin the kidney can release, as a multiple of the usual level."
"parameter.k_map.name" = "Pressure response rate"
"parameter.k_map.meaning" = "An assumption of this project: on this time scale the pressure follows volume and vessel tone within about twenty minutes."
"parameter.k_map.up" = "Pressure follows volume and vessel tone more quickly."
"parameter.k_map.down" = "Pressure follows volume and vessel tone more slowly."
"parameter.k_exc.name" = "Excretion response rate"
"parameter.k_exc.meaning" = "An assumption of this project: sodium excretion follows pressure and hormones within about twenty minutes."
"parameter.k_exc.up" = "The kidney changes its sodium excretion more quickly."
"parameter.k_exc.down" = "The kidney changes its sodium excretion more slowly."
"parameter.k_renin.name" = "Renin response rate"
"parameter.k_renin.meaning" = "How fast plasma renin follows its release; renin is cleared with a half life of tens of minutes [hall2021]. The value is an assumption of this project."
"parameter.k_renin.up" = "Renin follows the kidney's signals more quickly."
"parameter.k_renin.down" = "Renin follows the kidney's signals more slowly."
"parameter.k_ang.name" = "Angiotensin response rate"
"parameter.k_ang.meaning" = "An assumption of this project: angiotensin II follows renin within about twenty minutes. In the body it is made and broken down within minutes [hall2021]."
"parameter.k_ang.up" = "Angiotensin II follows renin more quickly."
"parameter.k_ang.down" = "Angiotensin II follows renin more slowly."
"parameter.k_aldo.name" = "Aldosterone response rate"
"parameter.k_aldo.meaning" = "How fast aldosterone follows angiotensin II; its full effect on the kidney takes an hour or more [hall2021]. The value is an assumption of this project."
"parameter.k_aldo.up" = "Aldosterone follows angiotensin II more quickly."
"parameter.k_aldo.down" = "Aldosterone follows angiotensin II more slowly."
"parameter.kidney.name" = "Working kidney"
"parameter.kidney.meaning" = "The share of normal kidney tissue that still works, from 0.2 to 1. With less of it, the same pressure excretes less sodium [hall2021]."
"parameter.kidney.stop.normal" = "Normal"
"parameter.kidney.stop.half" = "Half"
"parameter.kidney.stop.low" = "Low"
"parameter.salt.name" = "Sodium intake"
"parameter.salt.meaning" = "The sodium eaten, as a multiple of a usual diet."
"parameter.stenosis.name" = "Pressure lost at the renal artery"
"parameter.stenosis.meaning" = "The fall in pressure across a narrowed renal artery, so the kidney is perfused at less than the pressure in the rest of the body [goldblatt1934]."
"parameter.ace.name" = "Converting enzyme"
"parameter.ace.meaning" = "How much angiotensin II is still made from a given renin level, from 0 (enzyme blocked) to 1."
"parameter.at1.name" = "Angiotensin receptors"
"parameter.at1.meaning" = "How much of the angiotensin II effect gets through, from 0 (blocked) to 1."
"parameter.mr.name" = "Aldosterone receptors"
"parameter.mr.meaning" = "How much of the aldosterone effect on the kidney gets through, from 0 (blocked) to 1."
"parameter.aldo_auto.name" = "Aldosterone made without control"
"parameter.aldo_auto.meaning" = "Aldosterone released whatever the angiotensin II level, as from an adrenal adenoma."
"parameter.diuretic.name" = "Diuretic effect"
"parameter.diuretic.meaning" = "How many times more sodium the kidney excretes at the same pressure and hormone levels under a diuretic."
"parameter.resist.name" = "Direct tightening of the vessels"
"parameter.resist.meaning" = "Vessel resistance as a multiple of normal under a drug that tightens the vessels directly."
"curve.natriuresis.name" = "Pressure natriuresis"
"curve.natriuresis.x" = "Pressure at the kidney (mmHg)"
"curve.natriuresis.y" = "Sodium passed on (multiple of usual intake)"
"part.vessels" = "Arteries"
"part.kidney" = "Kidney"
"part.lungs" = "Blood and lungs"
"part.adrenal" = "Adrenal cortex"
"part.fluid" = "Body fluid"
"effect.seen" = "Angiotensin II acts through its type 1 receptors on vessels, kidney and adrenal cortex [hall2021]."
"effect.renal_pressure" = "The kidney is perfused at the arterial pressure, less whatever is lost across a narrowed renal artery [goldblatt1934]."
"effect.filtered" = "A higher pressure at the kidney makes it pass on more sodium, and a lower pressure less: pressure natriuresis [guyton1972]."
"effect.delivery" = "Angiotensin II makes the early parts of the tubule take back more sodium, so less reaches the macula densa and the later tubule [hall1986]."
"effect.renin_target" = "The kidney releases more renin when its perfusion pressure falls and when less salt reaches the macula densa, and angiotensin II holds the release back [hall2021]."
"effect.ang_target" = "Renin splits angiotensin I from angiotensinogen, and converting enzyme, mostly in the lungs, turns it into angiotensin II [hall2021]."
"effect.aldo_target" = "Angiotensin II drives the adrenal cortex to release aldosterone [hall2021]."
"effect.map_target" = "Pressure follows how full the circulation is and how tight the small arteries are; more extracellular fluid means more blood, and angiotensin II tightens the vessels [guyton1972]."
"effect.excretion_target" = "Aldosterone makes the collecting duct take back sodium, so less of what reaches it is excreted; a diuretic does the opposite [hall2021]."
"term.fill_arteries" = "Pressure moves towards the level that the fluid volume and the vessel tone set [guyton1972]."
"term.run_off" = "Pressure settles at that level [guyton1972]."
"term.salt_in" = "Sodium eaten is absorbed and holds water with it, which adds to the extracellular fluid [hall2021]."
"term.salt_out" = "Sodium excreted takes water with it, which removes extracellular fluid [hall2021]."
"term.excrete" = "The kidney excretes the sodium that pressure and hormones allow [guyton1972]."
"term.settle_excretion" = "Sodium excretion settles at that level [guyton1972]."
"term.release_renin" = "The kidney releases renin into the blood [hall2021]."
"term.clear_renin" = "Renin is cleared from the blood, mainly by the liver [hall2021]."
"term.make_ang" = "Angiotensin II is made in proportion to renin [hall2021]."
"term.clear_ang" = "Angiotensin II is broken down in the blood and tissues within minutes [hall2021]."
"term.release_aldo" = "The adrenal cortex releases aldosterone [hall2021]."
"term.clear_aldo" = "Aldosterone is cleared by the liver [hall2021]."
"experiment.high_salt" = "High salt diet"
"experiment.high_salt.description" = "Eat three times the usual sodium. A healthy kidney comes into balance again within days: renin and aldosterone fall, and pressure rises only a little [hall2021]."
"experiment.low_salt" = "Low salt diet"
"experiment.low_salt.description" = "Eat about 20 mmol of sodium a day. Renin and aldosterone rise and the kidney holds on to almost all sodium [hall2021]."
"experiment.saline" = "Saline infusion"
"experiment.saline.option.volume" = "Volume"
"experiment.saline.description" = "Add a volume of isotonic saline to the extracellular fluid at once. The kidney excretes the extra over the next day or two [hall2021]."
"experiment.fluid_loss" = "Lose fluid"
"experiment.fluid_loss.option.volume" = "Volume"
"experiment.fluid_loss.description" = "Lose a volume of extracellular fluid at once, as with vomiting or diarrhoea. Renin rises and the kidney holds sodium until intake has replaced the loss [hall2021]."
"experiment.diuretic" = "Diuretic"
"experiment.diuretic.description" = "A drug that makes the kidney excrete more sodium at the same pressure, as a thiazide does. Sodium is lost for a day or two, then excretion matches intake again at a lower fluid volume and pressure, with more renin [hall2021]."
"experiment.ace_inhibitor" = "ACE inhibitor"
"experiment.ace_inhibitor.description" = "Block most of the converting enzyme: angiotensin II and aldosterone fall, pressure falls, and renin rises because nothing holds it back [hall2021]."
"experiment.arb" = "Angiotensin receptor blocker"
"experiment.arb.description" = "Block most type 1 angiotensin receptors: the effects are those of an ACE inhibitor, but angiotensin II itself rises with renin [hall2021]."
"experiment.spironolactone" = "Aldosterone blocker"
"experiment.spironolactone.description" = "Block most aldosterone receptors in the kidney, as spironolactone does: sodium is lost, and renin and aldosterone rise [hall2021]."
"experiment.vasoconstrictor" = "Vessel tightening drug"
"experiment.vasoconstrictor.description" = "Tighten the small arteries everywhere by a fifth and keep them so. Pressure rises at first, the kidney excretes more sodium, and pressure returns as fluid is lost: with a healthy kidney, resistance alone does not keep pressure high [guyton1972]."
"experiment.stenosis" = "Renal artery narrowing"
"experiment.stenosis.description" = "Narrow the artery to the kidney so that it loses 25 mmHg. Here all kidney tissue lies behind the narrowing, as with one kidney or both arteries narrowed. Renin surges, sodium is held, and pressure rises until the kidney is perfused normally again [goldblatt1934]."
"experiment.aldosteronism" = "Primary aldosteronism"
"experiment.aldosteronism.description" = "The adrenal cortex releases aldosterone on its own. Sodium is held and pressure rises until excretion matches intake again, and renin is suppressed [hall2021]."
"experiment.kidney_loss" = "Reduced kidney mass"
"experiment.kidney_loss.description" = "Only two fifths of the kidney tissue works. Pressure is a little higher on a usual diet and rises much more with salt [hall2021]."
"check.rest" = "On a usual diet the mean arterial pressure and the extracellular fluid volume stay in their normal ranges [hall2021]."
"check.salt_loaded" = "On a high salt diet the kidney excretes the extra sodium; renin and aldosterone fall, the extracellular fluid expands a little and pressure rises only slightly [hall2021]."
"check.salt_restricted" = "On a low salt diet excretion falls to match intake, renin and aldosterone rise and pressure falls a little [hall2021]."
"check.tightened" = "Tightening the vessels raises pressure at first, but the kidney excretes more sodium, fluid is lost and pressure returns to normal within days [guyton1972]."
"check.narrowed_artery" = "Narrowing the renal artery makes renin surge within hours; pressure then rises and stays high, while renin comes back towards normal once the kidney is perfused normally again [goldblatt1934]."
"check.excess_aldosterone" = "Excess aldosterone raises fluid volume and pressure and suppresses renin, yet sodium excretion returns to match intake: the kidney escapes from aldosterone [hall2021]."
"check.ace_blocked" = "An ACE inhibitor lowers angiotensin II, aldosterone and pressure, and renin rises [hall2021]."
"check.receptor_blocked" = "An angiotensin receptor blocker lowers aldosterone and pressure, while renin and angiotensin II both rise [hall2021]."
"check.diuretic_given" = "A diuretic raises sodium excretion at first; within days excretion matches intake again at a lower fluid volume, with more renin [hall2021]."
"check.aldosterone_blocked" = "Blocking aldosterone receptors lowers the fluid volume, and renin and aldosterone rise [hall2021]."
"check.kidney_and_salt" = "With reduced kidney mass a high salt diet raises pressure clearly, and renin is suppressed [hall2021]."
"check.fluid_lost" = "After a loss of fluid, pressure falls, renin rises and the kidney excretes less sodium until the volume is restored [hall2021]."
"check.saline_given" = "After a saline infusion the kidney excretes more sodium and renin falls until the volume is back to normal [hall2021]."
