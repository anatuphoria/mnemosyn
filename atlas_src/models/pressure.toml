[[curves]]
key = "baroreceptors"
parameters = ["set_point", "steepness"]
x_low = 40
x_high = 160
expr = "afferent * (1 - hill(x, set_point, steepness))"
matches = "firing"
input = "sensed"

[[effects]]
key = "sensed"
expr = "map + sinus_press - reset * command"
kind = "drives"

[[effects]]
key = "firing"
expr = "afferent * (1 - hill(sensed, set_point, steepness))"
kind = "drives"
arrow = ["baroreceptors", "nts"]
via = ["nerves"]

[[effects]]
key = "symp_drive"
expr = "pos(1 + reflex * (symp_range * (1 - 2 * firing) + command))"
kind = "holds back"
arrow = ["nts", "vasomotor"]

[[effects]]
key = "vagal_drive"
expr = "pos(1 - reflex * (vagal_range * (1 - 2 * firing) + 0.5 * command))"
kind = "drives"
arrow = ["nts", "vagus"]

[[effects]]
key = "hr_target"
expr = "pos(hr_intrinsic + hr_symp * beta * symp - hr_vagal * muscarinic * vagal)"
kind = "drives"
arrow = ["vagus", "heart"]

[[effects]]
key = "fill"
expr = "(blood / blood_normal) * pooling * (1 + venous * (alpha * symp - 1))"
kind = "drives"
arrow = ["vessels", "heart"]

[[effects]]
key = "stroke"
expr = "sv_rest * pos(1 + starling * (fill - 1)) * (1 + inotropy * (beta * symp - 1)) * pos(1 - afterload * (map / set_point - 1))"
kind = "drives"

[[effects]]
key = "output"
expr = "hr * stroke / 1000"
kind = "drives"
arrow = ["heart", "vessels"]

[[effects]]
key = "tpr_target"
expr = "tpr_rest * (1 + tpr_gain * (alpha * symp - 1)) * dilate + constrict"
kind = "drives"
arrow = ["vasomotor", "vessels"]

[[terms]]
key = "build_pressure"
value = "map"
sign = 1
expr = "k_map * output * tpr"
kind = "drives"

[[terms]]
key = "run_off"
value = "map"
sign = -1
expr = "k_map * map"
kind = "clears"

[[terms]]
key = "pace"
value = "hr"
sign = 1
expr = "k_hr * hr_target"
kind = "drives"

[[terms]]
key = "settle_rate"
value = "hr"
sign = -1
expr = "k_hr * hr"
kind = "clears"

[[terms]]
key = "fire_symp"
value = "symp"
sign = 1
expr = "k_symp * symp_drive"
kind = "drives"

[[terms]]
key = "fade_symp"
value = "symp"
sign = -1
expr = "k_symp * symp"
kind = "clears"

[[terms]]
key = "fire_vagal"
value = "vagal"
sign = 1
expr = "k_vagal * vagal_drive"
kind = "drives"

[[terms]]
key = "fade_vagal"
value = "vagal"
sign = -1
expr = "k_vagal * vagal"
kind = "clears"

[[terms]]
key = "tighten"
value = "tpr"
sign = 1
expr = "k_tpr * tpr_target"
kind = "drives"

[[terms]]
key = "relax"
value = "tpr"
sign = -1
expr = "k_tpr * tpr"
kind = "clears"

[[terms]]
key = "refill_blood"
value = "blood"
sign = 1
expr = "refill * blood_normal"
kind = "absorbs"

[[terms]]
key = "shift_out"
value = "blood"
sign = -1
expr = "refill * blood"
kind = "clears"

