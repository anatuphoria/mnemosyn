[[checks]]
key = "rest"
length = "10 min"
asserts = [
  { kind = "within", value = "map", at = "day 1 08:05", low = 85, high = 100 },
  { kind = "within", value = "hr", at = "day 1 08:05", low = 60, high = 80 },
]

[[checks]]
key = "standing"
length = "10 min"
blocks = [{ experiment = "stand", start = "day 1 08:02" }]
asserts = [
  { kind = "vs_normal", value = "hr", at = "day 1 08:05", rises = 1.1 },
  { kind = "vs_normal", value = "symp", at = "day 1 08:05", rises = 1.05 },
  { kind = "vs_normal", value = "vagal", at = "day 1 08:05", falls = 0.9 },
  { kind = "vs_normal", value = "tpr", at = "day 1 08:05", rises = 1.02 },
  { kind = "back_to_normal", value = "map", by = "day 1 08:05", tolerance = 0.1 },
]

[[checks]]
key = "bleeding"
length = "10 min"
blocks = [{ experiment = "blood_loss", start = "day 1 08:02" }]
asserts = [
  { kind = "vs_normal", value = "hr", at = "day 1 08:05", rises = 1.15 },
  { kind = "vs_normal", value = "symp", at = "day 1 08:05", rises = 1.1 },
  { kind = "vs_normal", value = "tpr", at = "day 1 08:05", rises = 1.05 },
  { kind = "vs_normal", value = "map", at = "day 1 08:05", falls = 0.95 },
]

[[checks]]
key = "tightening"
length = "10 min"
blocks = [{ experiment = "vasoconstrictor", start = "day 1 08:02" }]
asserts = [
  { kind = "vs_normal", value = "map", at = "day 1 08:05", rises = 1.05 },
  { kind = "vs_normal", value = "hr", at = "day 1 08:05", falls = 0.9 },
  { kind = "vs_normal", value = "vagal", at = "day 1 08:05", rises = 1.1 },
]

[[checks]]
key = "relaxing"
length = "10 min"
blocks = [{ experiment = "vasodilator", start = "day 1 08:02" }]
asserts = [
  { kind = "vs_normal", value = "map", at = "day 1 08:05", falls = 0.97 },
  { kind = "vs_normal", value = "hr", at = "day 1 08:05", rises = 1.1 },
]

[[checks]]
key = "beta_blocked"
length = "10 min"
blocks = [{ experiment = "beta_blocker", start = "day 1 08:02" }]
asserts = [
  { kind = "vs_normal", value = "hr", at = "day 1 08:05", falls = 0.97 },
  { kind = "vs_normal", value = "symp", at = "day 1 08:05", rises = 1.05 },
]

[[checks]]
key = "vagus_blocked"
length = "10 min"
blocks = [{ experiment = "atropine", start = "day 1 08:02" }]
asserts = [
  { kind = "vs_normal", value = "hr", at = "day 1 08:05", rises = 1.3 },
  { kind = "vs_normal", value = "symp", at = "day 1 08:05", falls = 0.9 },
]

[[checks]]
key = "alpha_blocked"
length = "10 min"
blocks = [{ experiment = "alpha_blocker", start = "day 1 08:02" }]
asserts = [
  { kind = "vs_normal", value = "map", at = "day 1 08:05", falls = 0.95 },
  { kind = "vs_normal", value = "hr", at = "day 1 08:05", rises = 1.1 },
]

[[checks]]
key = "nerves_cut"
length = "10 min"
blocks = [{ experiment = "denervation" }]
asserts = [
  { kind = "vs_normal", value = "map", at = "day 1 08:05", rises = 1.3 },
  { kind = "vs_normal", value = "hr", at = "day 1 08:05", rises = 1.3 },
  { kind = "vs_normal", value = "vagal", at = "day 1 08:05", falls = 0.5 },
]

[[checks]]
key = "failure_standing"
length = "10 min"
blocks = [{ experiment = "autonomic_failure" }, { experiment = "stand", start = "day 1 08:02" }]
asserts = [
  { kind = "vs_normal", value = "map", at = "day 1 08:05", falls = 0.9 },
  { kind = "back_to_normal", value = "hr", by = "day 1 08:05", tolerance = 0.05 },
]

[[checks]]
key = "sinus_pressed"
length = "10 min"
blocks = [{ experiment = "carotid_massage", start = "day 1 08:02", length = "1 min" }]
asserts = [
  { kind = "vs_normal", value = "hr", at = "day 1 08:03", falls = 0.9 },
  { kind = "vs_normal", value = "map", at = "day 1 08:03", falls = 0.9 },
  { kind = "back_to_normal", value = "hr", by = "day 1 08:06", tolerance = 0.05 },
]

[[checks]]
key = "alarm"
length = "10 min"
blocks = [{ experiment = "fright", start = "day 1 08:02" }]
asserts = [
  { kind = "vs_normal", value = "map", at = "day 1 08:04", rises = 1.1 },
  { kind = "vs_normal", value = "symp", at = "day 1 08:04", rises = 1.15 },
