[[checks]]
key = "kidney_and_salt"
length = "8 d"
blocks = [{ experiment = "kidney_loss" }, { experiment = "high_salt", start = "day 1 12:00" }]
asserts = [
  { kind = "vs_normal", value = "map", at = "day 7 12:00", rises = 1.1 },
  { kind = "vs_normal", value = "renin", at = "day 7 12:00", falls = 0.5 },
]

[[checks]]
key = "fluid_lost"
length = "8 d"
blocks = [{ experiment = "fluid_loss", start = "day 1 12:00" }]
asserts = [
  { kind = "vs_normal", value = "renin", at = "day 1 18:00", rises = 1.5 },
  { kind = "vs_normal", value = "excretion", at = "day 1 18:00", falls = 0.6 },
  { kind = "vs_normal", value = "map", at = "day 1 18:00", falls = 0.97 },
  { kind = "back_to_normal", value = "ecf", by = "day 7 12:00", tolerance = 0.02 },
]

[[checks]]
key = "saline_given"
length = "8 d"
blocks = [{ experiment = "saline", start = "day 1 12:00" }]
asserts = [
  { kind = "vs_normal", value = "excretion", at = "day 1 18:00", rises = 1.3 },
  { kind = "vs_normal", value = "renin", at = "day 1 18:00", falls = 0.8 },
  { kind = "back_to_normal", value = "ecf", by = "day 7 12:00", tolerance = 0.02 },
]
