high = 12
refs = ["guyton1972"]
group = "kidney"
control = "curve"

[[parameters]]
key = "salt_normal"
value = 0.104167
unit = "mmol/min"
low = 0.05
high = 0.2
refs = ["hall2021"]
group = "body"

[[parameters]]
key = "ecf_normal"
value = 14
unit = "L"
low = 11
high = 17
refs = ["hall2021"]
group = "body"

[[parameters]]
