[[values]]
key = "ecf"
unit = "L"
start = 14.0
display_scale = 1.0
display_unit = "L"
normal = [13, 15]
lane = 2
refs = ["hall2021"]

[[values]]
key = "excretion"
unit = "mmol/min"
start = 0.104167
display_scale = 1440.0
display_unit = "mmol/day"
lane = 3
refs = ["hall2021"]

[[values]]
key = "renin"
unit = "times normal"
start = 1.0
display_scale = 1.0
display_unit = "times normal"
relative = true
lane = 4
refs = ["hall2021"]

[[values]]
key = "ang"
unit = "times normal"
