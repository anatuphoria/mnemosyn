structure = 2580
x = 1
y = 0
values = []

[[parts]]
key = "pvn"
structure = 2510
x = 1
y = 1
values = []

[[parts]]
key = "pituitary"
structure = 2700
x = 2
y = 0
values = ["avp"]

[[parts]]
key = "kidney"
x = 3
