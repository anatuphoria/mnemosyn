[[parameters]]
key = "avp_slope"
value = 0.4
unit = "pg/mL per mOsm/kg"
low = 0.1
high = 1.0
refs = ["robertson1976", "baylis1980"]

[[parameters]]
key = "k_avp"
value = 0.0288
unit = "/min"
low = 0.01
high = 0.1
refs = ["baumann1976"]

[[parameters]]
key = "uosm_min"
value = 50
unit = "mOsm/kg"
low = 30
high = 100
refs = ["hall2021"]

[[parameters]]
key = "uosm_max"
value = 1200
unit = "mOsm/kg"
low = 800
high = 1400
refs = ["hall2021"]

[[parameters]]
key = "K_u"
value = 1.0
unit = "pg/mL"
low = 0.5
high = 5
refs = ["robertson1973"]

[[parameters]]
key = "n_u"
value = 4
unit = "exponent"
low = 1
high = 4

[[parameters]]
key = "k_kidney"
value = 0.1
unit = "/min"
low = 0.005
high = 0.2

[[parameters]]
key = "solute"
value = 0.417
unit = "mOsm/min"
low = 0.2
high = 1.2
refs = ["hall2021"]

[[parameters]]
key = "solute_ref"
value = 12012
