[[parameters]]
key = "habit"
value = 0.00167
unit = "L/min"
low = 0.0005
high = 0.005
refs = ["hall2021"]

[[parameters]]
key = "drink_threshold"
value = 294
unit = "mOsm/kg"
low = 285
high = 300
refs = ["thompson1986", "baylis1980"]

[[parameters]]
key = "drink_gain"
value = 0.005
unit = "L/min per mOsm/kg"
low = 0.0005
high = 0.02

[[parameters]]
key = "thirst_threshold"
value = 281
unit = "mOsm/kg"
low = 270
high = 295
refs = ["thompson1986"]

[[parameters]]
key = "thirst_slope"
value = 0.3
unit = "cm per mOsm/kg"
low = 0.05
high = 1
refs = ["thompson1986"]

[[parameters]]
key = "drink_max"
value = 0.02
unit = "L/min"
low = 0.005
high = 0.05

[[parameters]]
key = "k_thirst"
value = 0.1
unit = "/min"
low = 0.01
high = 1

[[parameters]]
key = "k_gut"
value = 0.046
unit = "/min"
low = 0.01
high = 0.2

[[parameters]]
key = "ddavp_clear"
value = 0.00312
unit = "/min"
low = 0.001
high = 0.01
refs = ["agerso2004"]

[[parameters]]
key = "ddavp_potency"
value = 10
unit = "pg/mL per µg"
low = 1
high = 50

[[parameters]]
key = "drinking"
value = 1
unit = "fraction"
low = 0
high = 1
panel = false

[[parameters]]
key = "habit_scale"
value = 1
unit = "times normal"
low = 0
high = 5

[[parameters]]
key = "avp_scale"
value = 1
unit = "fraction"
low = 0
high = 1

[[parameters]]
key = "avp_auto"
value = 0
unit = "pg/mL"
low = 0
high = 30
panel = false

[[parameters]]
key = "kidney"
value = 1
unit = "fraction"
low = 0
high = 1

[[parameters]]
key = "salt_in"
value = 0
unit = "mOsm/min"
low = 0
high = 20
panel = false

[[parameters]]
key = "iv_water"
value = 0
unit = "L/min"
low = 0
high = 0.02
panel = false

[[effects]]
key = "avp_release"
expr = "avp_scale * pos(avp_slope * (sodium - avp_threshold)) + avp_auto"
kind = "drives"
arrow = ["osmoreceptors", "pituitary"]
via = ["son", "pvn"]

[[effects]]
key = "kidney_signal"
expr = "avp + ddavp_potency * ddavp"
kind = "drives"
arrow = ["pituitary", "kidney"]

[[effects]]
key = "concentrating"
expr = "uosm_min + kidney * (uosm_max - uosm_min) * (1 - hill(kidney_signal, K_u, n_u))"
kind = "drives"

[[effects]]
key = "solute_out"
expr = "solute * sodium * water / solute_ref"
kind = "drives"

[[effects]]
key = "urine_flow"
expr = "1000 * solute_out / uosm"
kind = "holds back"
arrow = ["kidney", "blood"]

[[effects]]
key = "thirst_drive"
expr = "thirst_slope * pos(sodium - thirst_threshold)"
kind = "drives"

[[effects]]
key = "drink"
expr = "drinking * min(drink_max, habit * habit_scale + drink_gain * pos(sodium - drink_threshold))"
kind = "drives"
arrow = ["osmoreceptors", "blood"]

[[terms]]
key = "release_avp"
value = "avp"
sign = 1
expr = "k_avp * avp_release"
kind = "drives"

[[terms]]
key = "clear_avp"
value = "avp"
sign = -1
expr = "k_avp * avp"
kind = "clears"

[[terms]]
key = "concentrate_urine"
value = "uosm"
sign = 1
expr = "k_kidney * concentrating"
kind = "drives"

[[terms]]
key = "relax_urine"
value = "uosm"
sign = -1
expr = "k_kidney * uosm"
kind = "clears"

[[terms]]
key = "feel_thirst"
value = "thirst"
sign = 1
expr = "k_thirst * thirst_drive"
kind = "drives"

[[terms]]
key = "fade_thirst"
value = "thirst"
sign = -1
expr = "k_thirst * thirst"
kind = "clears"

[[terms]]
key = "swallow"
value = "gut"
sign = 1
expr = "drink"
kind = "drives"

[[terms]]
key = "absorb_gut"
value = "gut"
sign = -1
expr = "k_gut * gut"
kind = "absorbs"

[[terms]]
key = "absorb_water"
value = "water"
sign = 1
expr = "k_gut * gut + iv_water"
kind = "absorbs"

[[terms]]
key = "lose_urine"
value = "water"
sign = -1
expr = "urine_flow / 1000"
kind = "clears"

[[terms]]
key = "lose_insensible"
value = "water"
sign = -1
expr = "insensible"
kind = "clears"

[[terms]]
key = "dilute"
value = "sodium"
sign = -1
expr = "sodium * (k_gut * gut + iv_water) / water"
kind = "absorbs"

[[terms]]
key = "concentrate"
value = "sodium"
sign = 1
expr = "sodium * (urine_flow / 1000 + insensible) / water"
kind = "drives"

[[terms]]
key = "eat_solute"
value = "sodium"
sign = 1
expr = "solute / water"
kind = "drives"

[[terms]]
key = "pass_solute"
value = "sodium"
sign = -1
expr = "solute_out / water"
kind = "clears"

[[terms]]
key = "add_salt"
value = "sodium"
sign = 1
expr = "salt_in / water"
kind = "drives"

[[terms]]
key = "clear_ddavp"
value = "ddavp"
sign = -1
expr = "ddavp_clear * ddavp"
kind = "clears"

