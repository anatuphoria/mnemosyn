[project]
name = "mnemosyn"
version = "0.1.0"
description = "3D atlas of the central nervous system: desktop app and atlas build tool"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "nibabel>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.17,<0.18"]
desktop = [
  "PySide6-Essentials>=6.8",
  "vtk>=9.4",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  "pyqtgraph>=0.13",
  "fsrs>=6.3,<7",
]
atlas-build = ["vtk>=9.4", "pyvista>=0.44", "scipy>=1.11"]
package = ["pyinstaller>=6.22,<7"]
brand = ["fonttools>=4.50"]

[project.scripts]
cns-desktop = "cns_desktop.app:main"
mnemosyn = "cns_desktop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cns_atlas", "cns_desktop", "cns_study", "tools"]

[tool.ruff]
line-length = 100
extend-exclude = ["review"]

[tool.ruff.lint]
ignore = ["I001", "ISC004"]

[tool.pytest.ini_options]
markers = [
  "slow: downloads data or needs the real atlas package",
  "perf: enforces a performance budget",
]
addopts = "-m 'not slow'"
