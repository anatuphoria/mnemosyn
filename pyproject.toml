[project]
name = "brain-tui"
version = "0.1.0"
description = "3D TUI Brain Model - rotate, slice, isolate and study 116+ regions in the terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=3.0",
  "textual-hires-canvas>=0.14",
  "par-textual-image>=0.1",
  "numpy>=1.26",
  "pillow>=10.0",
  "trimesh>=4.0",
  "nibabel>=5.0",
  "scikit-image>=0.22",
  "nilearn>=0.10",
  "numba>=0.60",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# desktop prototype; Essentials avoids pulling in Qt WebEngine (~hundreds of MB)
desktop = [
  "PySide6-Essentials>=6.8",
  "vtk>=9.4",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  "pyqtgraph>=0.13",
]

[project.scripts]
brain-tui = "brain_tui.app:main"
cns-desktop = "cns_desktop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain_tui", "cns_desktop", "tools"]

[tool.ruff]
line-length = 100
