[project]
name = "brain-tui"
version = "0.1.0"
description = "3D atlas of the central nervous system: desktop app, terminal viewer and atlas build tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=3.0",
  "textual-hires-canvas>=0.14",
  "par-textual-image>=0.1",
  "numpy>=1.26",
  "pillow>=10.0",
  "nibabel>=5.0",
  "numba>=0.60",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
desktop = [
  "PySide6-Essentials>=6.8",
  "vtk>=9.4",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  "pyqtgraph>=0.13",
]
atlas-build = ["vtk>=9.4", "pyvista>=0.44", "scipy>=1.11"]

[project.scripts]
brain-tui = "brain_tui.app:main"
cns-desktop = "cns_desktop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain_tui", "cns_atlas", "cns_desktop", "tools"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
  "slow: downloads data or needs the real atlas package",
  "perf: enforces a performance budget",
]
addopts = "-m 'not slow'"
